<!DOCTYPE html>
<html>
<head>
    <title>jQuery Mafia Box Animation</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
            background: #1a1a1a;
            color: gold;
        }

        button {
            padding: 8px 15px;
            margin-bottom: 15px;
            background: #8b0000;
            color: gold;
            border: 2px solid gold;
            cursor: pointer;
        }

        .container {
            width: 450px;
            height: 300px;
            border: 2px solid gold;
            position: relative;
            background: #2b0000;
        }

        #box {
            width: 50px;
            height: 50px;
            background: #8b0000;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>

<body>

    <button id="start">Start Mafia Animation</button>

    <div class="container">
        <div id="box"></div>
    </div>

    <script>
        $(document).ready(function () {

            $("#start").click(function () {

                $("#box")
                    .animate({ top: "250px" }, 1000, function () {
                        $(this).css("background", "#000000");
                    })

                    .animate({ left: "400px" }, 1000, function () {
                        $(this).css("background", "#d4af37");
                    })

                    .animate({ top: "0px" }, 1000, function () {
                        $(this).css("background", "#4b0000");
                    })

                    .animate({ left: "0px" }, 1000, function () {
                        $(this).css("background", "#8b0000");
                    });

            });

        });
    </script>

</body>
</html>
