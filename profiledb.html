
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>David Basnet - Profile Card</title>

    <!-- jQuery Library -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #0a0a0a;
            color: white;
            padding-top: 50px;
            transition: background-color 0.5s;
        }

        h1 {
            color: #d4af37;
            letter-spacing: 3px;
            text-shadow: 2px 2px 10px #8b0000;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #d4af37;
            border-radius: 5px;
            background-color: #111;
            color: white;
            margin: 5px;
            transition: 0.3s;
        }

        button:hover {
            background-color: #8b0000;
            transform: scale(1.05);
        }

        /* Profile Card */
        #profileCard {
            width: 300px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 15px;
            background-color: #151515;
            border: 2px solid #d4af37;
            box-shadow: 0 5px 25px #8b0000;
            transition: background-color 0.5s;
        }

        /* Profile Picture */
        #profileCard img.profile {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center 75%;
            border: 4px solid #d4af37;
            box-shadow: 0 0 15px #8b0000;
        }

        h2 {
            margin-bottom: 5px;
            color: #d4af37;
        }

        p {
            color: #ddd;
            line-height: 1.5;
        }

        /* LinkedIn Button */
        .linkedin {
            background-color: #8b0000;
            color: white;
            border: 1px solid #d4af37;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 5px;
            display: inline-block;
            margin: 8px;
            transition: 0.3s;
        }

        .linkedin:hover {
            background-color: #b30000;
        }

        /* QR Code */
        #profileCard img.qr {
            width: 150px;
            height: 150px;
            margin: 10px;
            border: 4px solid white;
            border-radius: 5px;
        }

        /* QR Hidden Initially */
        #qrSection {
            display: none;
        }

        .showQR {
            background-color: #8b0000;
        }

        .close {
            background-color: #111;
            border: 1px solid #8b0000;
        }

        /* Background when QR is Open */
        body.qr-open {
            background-color: #1a0000;
        }

        /* Mobile Responsive */
        @media (max-width: 400px) {
            #profileCard {
                width: 80%;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <h1>MY PROFILE</h1>

    <div id="profileCard">

        <!-- Profile Picture -->
        <!-- Keep Profile.jpg in the same folder -->
        <img class="profile"
             src="Profiledb.jpg"
             alt="David Basnet">

        <h2>David Basnet</h2>

        <p>
            <strong>Address:</strong><br>
            Kathmandu, Nepal
        </p>

        <p>
            <strong>Program:</strong><br>
            BSc Information Technology
        </p>

        <p>
            <strong>Field:</strong><br>
            Information Technology
        </p>

        <!-- LinkedIn Profile Link -->
        <a class="linkedin"
           href="https://www.linkedin.com/in/john-bhattarai-4796a9284/"
           target="_blank"
           rel="noopener noreferrer">
            Visit My LinkedIn
        </a>

        <br>

        <!-- Show QR Button -->
        <button class="showQR">
            Show QR
        </button>

        <!-- QR Code Section -->
        <div id="qrSection">

            <img class="qr"
                 src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https%3A%2F%2Fwww.linkedin.com%2Fin%2Fjohn-bhattarai-4796a9284%2F"
                 alt="LinkedIn QR Code">

            <p>Scan to view my LinkedIn profile</p>

            <!-- Close Button -->
            <button class="close">
                Close QR
            </button>

        </div>

    </div>

    <!-- jQuery Code -->
    <script>
        $(document).ready(function() {

            // Show QR Code
            $(".showQR").click(function() {

                $("#qrSection").stop(true, true).slideDown(500);

                $("#profileCard").css(
                    "background-color", "#2b0000"
                );

                $("body").addClass("qr-open");
            });

            // Close QR Code
            $(".close").click(function() {

                $("#qrSection").stop(true, true).slideUp(500);

                $("#profileCard").css(
                    "background-color", "#151515"
                );

                $("body").removeClass("qr-open");
            });

        });
    </script>

</body>
</html>
