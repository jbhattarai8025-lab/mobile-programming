<!DOCTYPE html>
<html>
<head>
    <title>John Bhattarai - Profile Card</title>

    <!-- jQuery Library -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #0a0a0a;
            color: white;
            padding-top: 50px;
            transition: background-color 0.5s;
        }

        h1 {
            color: #d4af37;
            letter-spacing: 2px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #111;
            color: white;
            margin: 5px;
        }

        button:hover {
            background-color: #8b0000;
        }

        /* Profile Card */
        #profileCard {
            width: 300px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 15px;
            background-color: #151515;
            border: 2px solid #d4af37;
            box-shadow: 0 5px 25px #000;
            transition: background-color 0.5s;
        }

        /* Profile Picture */
        #profileCard img.profile {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #d4af37;
        }

        /* QR Code */
        #profileCard img.qr {
            width: 120px;
            height: 120px;
            margin: 10px;
            border: 4px solid white;
        }

        h2 {
            margin-bottom: 5px;
            color: #d4af37;
        }

        p {
            color: #ddd;
        }

        /* QR hidden initially */
        #qrSection {
            display: none;
        }

        /* Show QR Button */
        .showQR {
            background-color: #8b0000;
            border: 1px solid #d4af37;
        }

        /* Close Button */
        .close {
            background-color: #111;
            border: 1px solid #8b0000;
        }

        .showQR:hover {
            background-color: #b30000;
        }

        .close:hover {
            background-color: #8b0000;
        }

        /* Background when QR is open */
        body.qr-open {
            background-color: #1a0000;
        }

    </style>
</head>

<body>

    <h1>MY PROFILE</h1>

    <div id="profileCard">

        <!-- Profile Image -->
        <!-- Keep Profile.jpg in the same folder as this HTML file -->
        <img class="profile"
             src="Profile.jpg"
             alt="John Bhattarai">

        <h2>John Bhattarai</h2>

        <p>
            <strong>Address:</strong>
            Kathmandu, Nepal
        </p>

        <p>
            <strong>Program:</strong>
            BSc Information Technology
        </p>

        <!-- Show QR Button -->
        <button class="showQR">
            Show QR
        </button>


        <!-- QR Section -->
        <div id="qrSection">

            <!-- QR Code for LinkedIn -->
            <img class="qr"
                 src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https%3A%2F%2Fwww.linkedin.com%2Fin%2Fjohn-bhattarai-4796a9284%2F"
                 alt="LinkedIn QR Code">

            <br>

            <p>
                Scan to view my LinkedIn profile
            </p>

            <!-- Close Button -->
            <button class="close">
                Close
            </button>

        </div>

    </div>


    <!-- jQuery Code -->
    <script>

        $(document).ready(function() {

            // Show QR button
            $(".showQR").click(function() {

                // Show QR section with animation
                $("#qrSection").slideDown();

                // Change profile card color
                $("#profileCard").css(
                    "background-color",
                    "#2b0000"
                );

                // Change page background
                $("body").addClass("qr-open");

            });


            // Close button
            $(".close").click(function() {

                // Hide QR section with animation
                $("#qrSection").slideUp();

                // Change profile card back to black
                $("#profileCard").css(
                    "background-color",
                    "#151515"
                );

                // Change page background back
                $("body").removeClass("qr-open");

            });

        });

    </script>

</body>
</html>
