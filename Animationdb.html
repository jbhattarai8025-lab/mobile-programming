
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>jQuery Black & White Box Animation</title>

    <!-- jQuery Library -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #000000;
            color: white;
        }

        button {
            padding: 10px 18px;
            margin-bottom: 15px;
            background: #ffffff;
            color: #000000;
            border: 2px solid #888888;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background: #333333;
            color: white;
            transform: scale(1.05);
        }

        .container {
            width: 450px;
            height: 300px;
            border: 2px solid white;
            position: relative;
            background: #1a1a1a;
            box-shadow: 0 0 15px #555555;
        }

        #box {
            width: 50px;
            height: 50px;
            background: #ffffff;
            position: absolute;
            top: 0;
            left: 0;
            border: 1px solid #888888;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <h2>BLACK & WHITE BOX ANIMATION</h2>

    <button id="start">Start Animation</button>

    <div class="container">
        <div id="box"></div>
    </div>

    <script>
        $(document).ready(function () {

            $("#start").click(function () {

                // Prevent multiple animation queues
                $("#box").stop(true, true).css({
                    top: "0px",
                    left: "0px",
                    background: "#ffffff"
                });

                $("#box")

                    // Move Down
                    .animate({ top: "250px" }, 1000, function () {
                        $(this).css("background", "#000000");
                    })

                    // Move Right
                    .animate({ left: "400px" }, 1000, function () {
                        $(this).css("background", "#888888");
                    })

                    // Move Up
                    .animate({ top: "0px" }, 1000, function () {
                        $(this).css("background", "#333333");
                    })

                    // Move Left
                    .animate({ left: "0px" }, 1000, function () {
                        $(this).css("background", "#ffffff");
                    });

            });

        });
    </script>

</body>
</html>
